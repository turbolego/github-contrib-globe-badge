name: Update cobe profile badge

on:
  schedule:
    - cron: '0 0 * * *'   # daily
  workflow_dispatch:

jobs:
  build-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system dependencies for canvas
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Generate badge.svg
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: node badge/generate-badge.js
      - name: Commit badge.svg
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "💖 Update cobe profile badge"
          file_pattern: badge.svg
          branch: main