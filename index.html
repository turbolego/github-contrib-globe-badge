<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub contribution analytics</title>
  <style>
    :root { color-scheme: light; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #18202a; }
    main { width: min(94vw, 760px); padding: 28px 0 42px; text-align: center; }
    .eyebrow { letter-spacing: .28em; color: #1745d1; font-size: clamp(15px, 2.5vw, 24px); margin: 0 0 8px; }
    h1 { font-size: clamp(18px, 3vw, 28px); font-weight: 500; margin: 0 0 8px; }
    .subtle { color: #6b7280; font-size: 12px; margin: 0 0 10px; }
    .globe-wrap { position: relative; width: min(92vw, 620px); aspect-ratio: 1; margin: 0 auto; }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .label { position: absolute; transform: translate(-50%, -100%); padding: 9px 12px; border-radius: 8px; background: rgba(23,23,23,.94); color: #fff; white-space: nowrap; pointer-events: none; box-shadow: 0 6px 18px #0002; }
    .label strong { font-size: 19px; }
    .label span { color: #34d399; font-size: 12px; margin-left: 8px; }
    .legend { margin: 4px auto 0; color: #6b7280; font-size: 12px; }
    .rule { width: min(74vw, 540px); height: 5px; margin: 24px auto 15px; background: #1745d1; }
    footer { color: #9ca3af; font-size: 11px; }
    a { color: #1745d1; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ANALYTICS</p>
    <h1 id="title">GitHub contribution globe</h1>
    <p class="subtle" id="summary">Loading contribution data…</p>
    <div class="globe-wrap" id="globe-wrap">
      <canvas id="globe" width="1200" height="1200" aria-label="Interactive contribution globe"></canvas>
    </div>
    <p class="legend">Drag to rotate · Scroll to zoom · Green markers show repository-owner locations</p>
    <div class="rule"></div>
    <footer><a href="https://github.com/turbolego/cobe-github-profile-badge">Source repository</a></footer>
  </main>
  <script type="module">
    import createGlobe from 'https://cdn.jsdelivr.net/npm/cobe@2.0.1/+esm';

    const canvas = document.querySelector('#globe');
    const wrap = document.querySelector('#globe-wrap');
    const summary = document.querySelector('#summary');
    const labels = [];
    const state = { phi: 0, theta: 0.18, scale: 1.05 };
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const labelPosition = (lat, lon) => {
      const latRad = lat * Math.PI / 180;
      const lonRad = lon * Math.PI / 180 + state.phi;
      const x = Math.cos(latRad) * Math.sin(lonRad);
      const y = Math.sin(latRad);
      const z = Math.cos(latRad) * Math.cos(lonRad);
      return { x, y, z };
    };
    const updateLabels = () => {
      for (const item of labels) {
        const point = labelPosition(...item.location);
        item.element.style.opacity = point.z > 0 ? '1' : '0';
        item.element.style.left = `${50 + point.x * 43}%`;
        item.element.style.top = `${50 - point.y * 43}%`;
      }
    };

    const data = await fetch('./data.json').then((response) => response.json());
    document.querySelector('#title').textContent = `${data.user}'s contribution globe`;
    summary.textContent = `${data.totalCommits.toLocaleString()} tracked commits · updated ${new Date(data.generatedAt).toLocaleDateString()}`;

    for (const marker of data.markers) {
      const element = document.createElement('div');
      element.className = 'label';
      const percentage = Math.round(marker.commits / data.totalCommits * 100);
      element.innerHTML = `<strong>${marker.commits}</strong><span>↑ ${percentage}%</span>`;
      element.title = `${marker.owner}: ${marker.commits} commits (${percentage}%)`;
      wrap.append(element);
      labels.push({ element, location: marker.location });
    }

    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 1200,
      height: 1200,
      phi: state.phi,
      theta: state.theta,
      dark: 0,
      diffuse: 1.2,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [1, 1, 1],
      markerColor: [0.2, 0.82, 0.45],
      glowColor: [1, 1, 1],
      markers: data.markers.map((marker) => ({ location: marker.location, size: 0.055 })),
      onRender: (renderState) => {
        if (!dragging) state.phi += 0.0018;
        renderState.phi = state.phi;
        renderState.theta = state.theta;
        renderState.scale = state.scale;
        updateLabels();
      },
    });

    canvas.addEventListener('pointerdown', (event) => { dragging = true; lastX = event.clientX; lastY = event.clientY; canvas.setPointerCapture(event.pointerId); });
    canvas.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      state.phi += (event.clientX - lastX) * 0.008;
      state.theta = clamp(state.theta + (event.clientY - lastY) * 0.004, -0.8, 0.8);
      lastX = event.clientX; lastY = event.clientY;
    });
    canvas.addEventListener('pointerup', () => { dragging = false; });
    canvas.addEventListener('pointercancel', () => { dragging = false; });
    canvas.addEventListener('wheel', (event) => { event.preventDefault(); state.scale = clamp(state.scale - event.deltaY * 0.001, 0.75, 1.35); }, { passive: false });
  </script>
</body>
</html>
